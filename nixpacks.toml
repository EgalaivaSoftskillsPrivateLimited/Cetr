# Node 22 is required by Next 16 and Puppeteer 25.
# Do not apt-install `chromium` on Ubuntu 24.04 — it is a snap stub and
# does not provide a browser inside Docker. Puppeteer downloads Chrome itself.

[phases.setup]
nixPkgs = ["nodejs_22"]
aptPkgs = [
  "ca-certificates",
  "fonts-liberation",
  "fonts-noto-core",
  "libasound2t64",
  "libatk-bridge2.0-0t64",
  "libatk1.0-0t64",
  "libcups2t64",
  "libdbus-1-3",
  "libdrm2",
  "libgbm1",
  "libgtk-3-0t64",
  "libnss3",
  "libpango-1.0-0",
  "libx11-6",
  "libxcomposite1",
  "libxdamage1",
  "libxext6",
  "libxfixes3",
  "libxkbcommon0",
  "libxrandr2",
  "libxshmfence1",
  "libxss1",
]

[phases.install]
cmds = ["npm ci --include=dev"]

[variables]
NIXPACKS_NODE_VERSION = "22"
NPM_CONFIG_PRODUCTION = "false"
PUPPETEER_SKIP_DOWNLOAD = "false"
